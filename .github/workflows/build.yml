name: build-mac
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app
        run: |
          set -e
          APP=ThaiFix.app
          mkdir -p $APP/Contents/MacOS
          for a in arm64 x86_64; do
            if ! swiftc -O main.swift -target $a-apple-macos11 -o thaifix-$a -framework Cocoa -framework Carbon > log.txt 2>&1; then
              grep -E "error:" log.txt | head -20 | while read -r l; do echo "::error::$l"; done
              exit 1
            fi
          done
          ./thaifix-arm64 --test | while read -r l; do echo "::notice::$l"; done
          mv thaifix-arm64 thaifix-arm; mv thaifix-x86_64 thaifix-x86
          mkdir -p $APP/Contents/Resources
          cp icon/AppIcon.icns icon/MenuIcon.png icon/MenuIcon@2x.png $APP/Contents/Resources/
          lipo -create thaifix-arm thaifix-x86 -output $APP/Contents/MacOS/ThaiFix
          cat > $APP/Contents/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>ThaiFix</string>
            <key>CFBundleIdentifier</key><string>com.thaifix.app</string>
            <key>CFBundleExecutable</key><string>ThaiFix</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>0.1</string>
            <key>LSUIElement</key><true/>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
          </dict></plist>
          PLIST
          codesign --force --deep --sign - $APP
          ditto -c -k --keepParent $APP ThaiFix.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ThaiFix
          path: ThaiFix.zip
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: pwsh
        run: |
          dotnet build windows/ThaiFix.csproj -c Release -o out 2>&1 | Tee-Object build.log
          if ($LASTEXITCODE -ne 0) {
            Select-String -Path build.log -Pattern "error" | Select-Object -First 20 | ForEach-Object { Write-Output "::error::$($_.Line)" }
            exit 1
          }
          .\out\ThaiFix.exe --test test.txt
          Start-Sleep -Seconds 2
          Get-Content test.txt -Encoding UTF8 | ForEach-Object { Write-Output "::notice::WIN $_" }
          Copy-Item out\ThaiFix.exe ThaiFix.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ThaiFix-Windows
          path: ThaiFix.exe

  release:
    needs: [build, windows]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=v0.1.${{ github.run_number }}
          gh release create "$TAG" ThaiFix.zip ThaiFix.exe -R ${{ github.repository }} --title "ThaiFix $TAG" --notes "Mac: ThaiFix.zip → แตกไฟล์ → ลาก ThaiFix.app ไปไว้ใน Applications · Windows: ThaiFix.exe → ดับเบิลคลิก  
          Download ThaiFix.zip, unzip, and drag ThaiFix.app into Applications." --latest
